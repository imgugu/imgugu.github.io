<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>image</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f5f5f5;
        }
        
        .image-container {
            width: 100%;
            max-width: 100%;
            text-align: center;
            padding: 10px;
        }
        
        img {
            max-width: 100%;
            max-height: 90vh; 
            object-fit: contain;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        
        @media (orientation: portrait) {
            
            img {
                width: auto;
                max-width: 100%;
            }
        }
        
        @media (orientation: landscape) {
           
            img {
                height: auto;
                max-height: 90vh;
            }
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="img1.jpg" alt="">
    </div>
</body>
</html>
