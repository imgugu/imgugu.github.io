<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>项目信息</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding-bottom: 20px;
        }
        
        /* 通用样式 */
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }
        
        .section {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            padding: 15px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        
        .item {
            display: flex;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        
        .item-label {
            flex: 0 0 40%;
            color: #666;
            font-size: 14px;
        }
        
        .item-value {
            flex: 0 0 60%;
            font-size: 14px;
            color: #333;
            word-break: break-all;
        }
        
        /* Header 区域 */
        .header {
            background-color: #1989fa;
            color: white;
            padding: 20px 0;
            text-align: center;
            margin-bottom: 15px;
        }
        
        .main-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .sub-title {
            font-size: 14px;
            opacity: 0.9;
        }
        
        /* Users 区域 */
        .users .section-title {
            color: #1989fa;
        }
        
        /* 新增：用于两列布局的样式 */
        .two-columns {
            display: flex;
            flex-wrap: wrap;
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .column {
            flex: 0 0 50%;
            display: flex;
            padding-right: 10px;
        }
        
        .column .item-label {
            flex: 0 0 50%;
        }
        
        .column .item-value {
            flex: 0 0 50%;
        }
        
        .full-width {
            flex: 0 0 100%;
        }
        
        /* Lists 区域 */
        .lists .item:nth-child(odd) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <!-- Header 区域 -->
    <div class="header">
        <div class="container">
            <h1 class="main-title">项目安全生产信息</h1>
            <div class="sub-title">安全生产许可证详情</div>
        </div>
    </div>
    
    <!-- 主体内容 -->
    <div class="container">
        <!-- Users 区域 -->
        <div class="section users">
            <h2 class="section-title">项目负责人信息</h2>
            <!-- 两列布局，前两个键值对在同一行 -->
            <div class="two-columns">
                <div class="column">
                    <div class="item-label">主要负责人</div>
                    <div class="item-value">张三</div>
                </div>
                <div class="column">
                    <div class="item-label">项目负责人</div>
                    <div class="item-value">李四</div>
                </div>
            </div>
            <!-- 第三个键值对占一整行 -->
            <div class="item full-width">
                <div class="item-label">专职安全生产管理人员</div>
                <div class="item-value">王五</div>
            </div>
        </div>
        
        <!-- Lists 区域 -->
        <div class="section lists">
            <h2 class="section-title">项目详细信息</h2>
            <div class="item">
                <div class="item-label">项目名称</div>
                <div class="item-value">某某建设工程</div>
            </div>
            <div class="item">
                <div class="item-label">项目编号</div>
                <div class="item-value">PRJ20230001</div>
            </div>
            <div class="item">
                <div class="item-label">许可证编号</div>
                <div class="item-value">XKZ202301234567</div>
            </div>
            <div class="item">
                <div class="item-label">发证日期</div>
                <div class="item-value">2023-01-15</div>
            </div>
            <div class="item">
                <div class="item-label">有效期至</div>
                <div class="item-value">2026-01-14</div>
            </div>
            <div class="item">
                <div class="item-label">发证机关</div>
                <div class="item-value">某某市安全生产监督管理局</div>
            </div>
            <div class="item">
                <div class="item-label">项目地址</div>
                <div class="item-value">某某市某某区某某路123号</div>
            </div>
        </div>
    </div>
</body>
</html>
